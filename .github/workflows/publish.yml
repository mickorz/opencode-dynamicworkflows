# 打 v* tag 自动发布到 npm（npm Trusted Publishing / OIDC，无长期 token）
#
# 一次性前置配置（npmjs.com 包页 Settings → Trusted Publisher）：
#   Organization or user: mickorz
#   Repository: opencode-dynamicworkflows
#   Workflow filename: publish.yml
#   注意：配置与实际运行身份不匹配时发布报 E404（即使包存在）
#
# 发布流程（本地三步）：
#   1. 改代码并 commit
#   2. npm version patch（自动改版本号 + 提交 + 打 tag，如 v0.2.3）
#   3. git push --follow-tags（tag 推上去即触发本流水线）
#
# 兼容性硬要求：npm >= 11.5.1 才支持 OIDC 发布，node-version 必须用 24
# （Node 22 自带 npm < 11.5.1，OIDC 发布必失败）
# 排查与 token 方案对比见 npx-installer skill 的 reference/pitfalls.md

name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC 短期凭证，npmjs Trusted Publishing 用
      packages: write   # GitHub Packages 镜像发布用（GITHUB_TOKEN 自动生成，无需配 secret）

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # 防 npm 缓存投毒暴露 OIDC token（官方建议）

      - run: npm ci

      # OIDC Trusted Publishing 前置条件可观测：Node >= 22.14、npm >= 11.5.1 才支持
      - name: 打印工具链版本
        run: |
          node --version
          npm --version

      # 防手滑：tag 与 package.json 版本不一致直接失败，不发错版本
      - name: 校验 tag 与 package.json 版本一致
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - run: npm run typecheck

      - run: npm test

      # 显式 build：消除 publish 校验阶段的 "No bin file found" 警告（校验先于 prepublishOnly）
      - run: npm run build

      - name: 发布到 npm（OIDC，无需 token）
        run: npm publish --access public

      # ---------------- GitHub Packages 镜像（次要渠道，尽力而为） ----------------
      # 定位：npmjs 是用户正式安装渠道（npx 免配置）；GitHub Packages 仅作仓库页展示镜像，
      # 其安装需 .npmrc 映射 + GitHub token，对最终用户无增益。
      # 故 continue-on-error：镜像失败不阻塞主发布（npmjs 已成功即可），失败在 Actions 摘要里可见。
      # 顺序固定 npmjs 先行：若镜像失败后重跑整个流水线，npm 步骤会因版本已存在而拦下，不会双发。
      - name: 切换 registry 到 GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@mickorz"

      - name: 发布到 GitHub Packages（GITHUB_TOKEN）
        continue-on-error: true
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
